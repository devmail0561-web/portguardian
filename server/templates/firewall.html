<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortGuardian — Firewall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body>
    <div class="app-layout">
        <nav class="topbar">
            <div class="topbar-brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <h1>PortGuardian<span>v{{ version }}</span></h1>
            </div>
            <div class="topbar-right">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/firewall" class="nav-link active">Firewall</a>
                <a href="/audit" class="nav-link">Audit</a>
                <a href="/logout" class="nav-link logout">Logout</a>
            </div>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h2 class="page-title">Firewall</h2>
                    <p class="page-subtitle">Regles actives et gestion du blocage</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-primary" onclick="showBlockPortForm()">Bloquer un port</button>
                    <button class="btn btn-primary" onclick="showBlockIpForm()">Bloquer une IP</button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-label">Backend</span>
                        <div class="stat-card-icon blue">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        </div>
                    </div>
                    <div class="stat-card-value" id="fw-backend">—</div>
                    <div class="stat-card-sub">moteur firewall actif</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-label">Regles actives</span>
                        <div class="stat-card-icon red">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </div>
                    </div>
                    <div class="stat-card-value" id="fw-count">—</div>
                    <div class="stat-card-sub">regles DROP/DENY</div>
                </div>
            </div>

            <div class="table-container">
                <div class="table-header">
                    <div>
                        <span class="table-title">Regles de blocage actives</span>
                        <span class="table-count" id="rules-count"></span>
                    </div>
                    <div class="table-actions">
                        <button class="btn-action" onclick="refreshRules()">Actualiser</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Regle</th>
                        </tr>
                    </thead>
                    <tbody id="rules-body">
                        <tr><td colspan="2" class="empty-cell">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Block Port Form (hidden) -->
            <div id="block-port-form" class="action-form" style="display:none">
                <div class="table-container">
                    <div class="table-header">
                        <span class="table-title">Bloquer un port</span>
                    </div>
                    <div class="form-body">
                        <div class="form-row">
                            <label>Port(s)</label>
                            <input type="text" id="bp-spec" placeholder="80 ou 80,443 ou 8000-8100">
                        </div>
                        <div class="form-row">
                            <label>Protocole</label>
                            <select id="bp-proto">
                                <option value="tcp">TCP</option>
                                <option value="udp">UDP</option>
                                <option value="both">TCP+UDP</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label>Direction</label>
                            <select id="bp-dir">
                                <option value="in">Entrant</option>
                                <option value="out">Sortant</option>
                                <option value="both">Les deux</option>
                            </select>
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-cancel" onclick="hideBlockPortForm()">Annuler</button>
                            <button class="btn btn-danger" onclick="doBlockPort()">Bloquer</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Block IP Form (hidden) -->
            <div id="block-ip-form" class="action-form" style="display:none">
                <div class="table-container">
                    <div class="table-header">
                        <span class="table-title">Bloquer une IP</span>
                    </div>
                    <div class="form-body">
                        <div class="form-row">
                            <label>Adresse(s) IP</label>
                            <input type="text" id="bi-spec" placeholder="192.168.1.100 ou 10.0.0.0/24">
                        </div>
                        <div class="form-row">
                            <label>Direction</label>
                            <select id="bi-dir">
                                <option value="in">Entrant</option>
                                <option value="out">Sortant</option>
                                <option value="both">Les deux</option>
                            </select>
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-cancel" onclick="hideBlockIpForm()">Annuler</button>
                            <button class="btn btn-danger" onclick="doBlockIp()">Bloquer</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/actions.js"></script>
    <script>
        async function refreshRules() {
            const resp = await fetch("/api/firewall/rules");
            const data = await resp.json();
            document.getElementById("fw-backend").textContent = data.backend || "aucun";
            document.getElementById("fw-count").textContent = data.rules.length;
            document.getElementById("rules-count").textContent = data.rules.length + " regle(s)";

            const tbody = document.getElementById("rules-body");
            if (data.rules.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" class="empty-cell">Aucune regle de blocage active</td></tr>';
                return;
            }
            tbody.innerHTML = data.rules.map((rule, i) =>
                `<tr><td class="mono">${i + 1}</td><td class="mono">${escHtml(rule)}</td></tr>`
            ).join("");
        }

        function escHtml(s) {
            return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
        }

        function showBlockPortForm() { document.getElementById("block-port-form").style.display = ""; }
        function hideBlockPortForm() { document.getElementById("block-port-form").style.display = "none"; }
        function showBlockIpForm() { document.getElementById("block-ip-form").style.display = ""; }
        function hideBlockIpForm() { document.getElementById("block-ip-form").style.display = "none"; }

        async function doBlockPort() {
            const spec = document.getElementById("bp-spec").value.trim();
            if (!spec) return;
            await Actions.post("/api/actions/block-port", {
                spec,
                protocol: document.getElementById("bp-proto").value,
                direction: document.getElementById("bp-dir").value,
            });
            hideBlockPortForm();
            setTimeout(refreshRules, 500);
        }

        async function doBlockIp() {
            const spec = document.getElementById("bi-spec").value.trim();
            if (!spec) return;
            await Actions.post("/api/actions/block-ip", {
                spec,
                direction: document.getElementById("bi-dir").value,
            });
            hideBlockIpForm();
            setTimeout(refreshRules, 500);
        }

        refreshRules();
        setInterval(refreshRules, 10000);
    </script>
</body>
</html>
