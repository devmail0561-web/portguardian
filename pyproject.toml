[project]
name = "portguardian"
version = "0.2.0"
description = "A htop-like TUI for network ports with multi-host daemon and web dashboard"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "PortGuardian Team"}
]
dependencies = [
    "textual>=0.75.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "flask>=3.0.0",
]

[project.scripts]
portguardian = "portguardian.main:main"
portguardian-daemon = "portguardian.daemon.cli:main"
portguardian-server = "portguardian.server.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
