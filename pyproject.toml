[project]
name = "portguardian"
version = "1.0.0"
description = "A htop-like TUI for network ports, processes and systemd services"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "PortGuardian Team"}
]
dependencies = [
    "textual>=0.75.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
]

[project.scripts]
portguardian = "portguardian.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
